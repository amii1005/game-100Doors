<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>100 Doors</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .game {
            max-width: 600px;
            margin: auto;
            padding: 30px 20px;
            text-align: center;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 25px;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat {
            background: #1e293b;
            padding: 12px 15px;
            border-radius: 12px;
            flex: 1;
        }

        .door {
            font-size: 120px;
            margin: 30px 0;
            transition: 0.5s;
        }

        .door.open {
            transform: rotateY(80deg);
            opacity: 0.3;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:disabled {
            cursor: not-allowed;
        }

        .red {
            background: #ef4444;
        }

        .blue {
            background: #3b82f6;
        }

        .green {
            background: #22c55e;
        }

        .orange {
            background: #f97316;
        }

        .purple {
            background: #8b5cf6;
        }

        .gray {
            background: #475569;
        }

        #result {
            min-height: 35px;
            margin-top: 25px;
        }

        .correct {
            color: #4ade80;
        }

        .wrong {
            color: #f87171;
        }

        .word-area {
            width: 100%;
        }

        .word-pieces {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .answer {
            min-height: 55px;
            padding: 12px;
            background: #1e293b;
            border-radius: 12px;
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .memory-number {
            font-size: 45px;
            font-weight: bold;
            width: 100%;
            margin: 20px 0;
        }

        .memory-input {
            padding: 15px;
            font-size: 20px;
            border-radius: 10px;
            border: none;
            text-align: center;
            width: 100%;
            max-width: 300px;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .pause-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.92);
            z-index: 999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .pause-overlay.active {
            display: flex;
        }

        .pause-overlay h2 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .score-box {
            display: none;
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .score-box.show {
            display: block;
        }

        .save-info {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 10px;
        }

        @media (max-width: 500px) {

            .stats {
                flex-wrap: wrap;
            }

            .stat {
                min-width: 40%;
            }

            h1 {
                font-size: 32px;
            }

            .door {
                font-size: 90px;
            }
        }

        .door-reward {
    width: 220px;
    height: 220px;
    object-fit: contain;
    display: block;
    margin: 20px auto;
    border-radius: 20px;

    animation: rewardPop 0.7s ease-out;

    filter:
        drop-shadow(0 0 15px #22c55e)
        drop-shadow(0 0 30px #22c55e);
}

@keyframes rewardPop {

    0% {
        opacity: 0;
        transform: scale(0.2) rotate(-10deg);
    }

    60% {
        opacity: 1;
        transform: scale(1.15) rotate(5deg);
    }

    100% {
        transform: scale(1) rotate(0deg);
    }

}


    </style>
</head>

    // =====================================
    // RANDOM
    // =====================================

    function randomItem(array) {

        return array[
            Math.floor(
                Math.random() * array.length
            )
        ];

    }


    // =====================================
    // SAVE GAME
    // =====================================

    function saveGame() {

        const gameData = {

            doorNumber: doorNumber,

            lives: lives,

            score: score,

            time: time

        };

        localStorage.setItem(
            "100DoorsSave",
            JSON.stringify(gameData)
        );

    }


    // =====================================
    // LOAD GAME
    // =====================================

    function loadGame() {

        const savedGame =
            localStorage.getItem("100DoorsSave");

        if (!savedGame) {

            return false;

        }

        try {

            const gameData =
                JSON.parse(savedGame);

            doorNumber =
                gameData.doorNumber || 1;

            lives =
                gameData.lives ?? 3;

            score =
                gameData.score ?? 0;

            time =
                gameData.time ?? 30;

            updateStats();

            return true;

        } catch (error) {

            localStorage.removeItem(
                "100DoorsSave"
            );

            return false;

        }

    }


    // =====================================
    // UPDATE STATS
    // =====================================

   function updateStats() {

    document.getElementById(
        "doorNumber"
    ).textContent = doorNumber;

    document.getElementById(
        "lives"
    ).textContent = lives;

    document.getElementById(
        "score"
    ).textContent = score;

    document.getElementById(
        "timer"
    ).textContent = time;


    // Tombol kembali
    const backButton =
        document.getElementById("backButton");

    if (backButton) {

        if (doorNumber <= 1) {

            backButton.style.display = "none";

        } else {

            backButton.style.display = "inline-block";

        }

    }

}



    // =====================================
    // TIMER
    // =====================================

    function startTimer() {

        clearInterval(timer);

        if (paused) return;

        timer = setInterval(() => {

            if (paused) return;

            time--;

            document.getElementById(
                "timer"
            ).textContent = time;

            saveGame();

            if (time <= 0) {

                clearInterval(timer);

                document.getElementById(
                    "result"
                ).textContent =
                    "⏰ Waktu habis!";

                document.getElementById(
                    "result"
                ).className = "wrong";

                disableButtons();

                lives--;

                document.getElementById(
                    "lives"
                ).textContent = lives;

                saveGame();

                if (lives <= 0) {

                    gameOver();

                } else {

                    setTimeout(() => {

                        time = getTimeForDoor();

                        updateStats();

                        setupCurrentDoor();

                        startTimer();

                    }, 1500);

                }

            }

        }, 1000);

    }


    // =====================================
    // TIME SETIAP DOOR
    // =====================================

    function getTimeForDoor() {

        if (doorNumber === 1) return 30;

        if (doorNumber === 2) return 30;

        if (doorNumber === 3) return 30;

        if (doorNumber === 4) return 15;

        if (doorNumber === 5) return 30;

        if (doorNumber === 6) return 30;

        if (doorNumber === 7) return 30;

        if (doorNumber === 8) return 30;

        if (doorNumber === 9) return 30;

        if (doorNumber === 10) return 30;

        return 30;

    }


    // =====================================
    // PAUSE
    // =====================================

    function togglePause() {

        paused = !paused;

        const overlay =
            document.getElementById(
                "pauseOverlay"
            );

        if (paused) {

            clearInterval(timer);

            overlay.classList.add("active");

            saveGame();

        } else {

            overlay.classList.remove("active");

            startTimer();

        }

    }


    // =====================================
    // SCORE PANEL
    // =====================================

    function toggleScore() {

        const box =
            document.getElementById(
                "scoreBox"
            );

        if (
            box.classList.contains("show")
        ) {

            box.classList.remove("show");

            return;

        }

        document.getElementById(
            "scoreDoor"
        ).textContent = doorNumber;

        document.getElementById(
            "scoreLives"
        ).textContent = lives;

        document.getElementById(
            "scoreTotal"
        ).textContent = score;

        document.getElementById(
            "scoreProgress"
        ).textContent =
            Math.min(
                doorNumber,
                100
            ) + "%";

        box.classList.add("show");

    }

        document.getElementById(

        if (doorNumber === 1) {

            setupDoor1();

    // =====================================
    // NEXT DOOR
    // =====================================

    function nextDoor() {

        doorNumber++;

        time =
            getTimeForDoor();

        updateStats();

        saveGame();

        setupCurrentDoor();

        startTimer();

    }

     // =====================================
    // PREVIOUS DOOR
    // =====================================

    function previousDoor() {

    if (doorNumber <= 1) {
        return;
    }

    clearInterval(timer);
    clearTimeout(questionDelay);

    doorNumber--;

    time = getTimeForDoor();

    updateStats();

    setupCurrentDoor();

    startTimer();

    saveGame();

}

            document.getElementById(

    // =====================================
    // MENANG PINTU
    // =====================================

    function winDoor(points) {

        score += points;

        document.getElementById(
            "score"
        ).textContent = score;

        document.getElementById(
            "result"
        ).textContent =
            "🎉 BENAR! Pintu terbuka!";

        document.getElementById(
            "result"
        ).className =
            "correct";

        document.getElementById(
            "door"
        ).classList.add("open");

        disableButtons();

        clearInterval(timer);

        saveGame();

        setTimeout(
            nextDoor,
            1500
        );

    }


    // =====================================
    // KEHILANGAN NYAWA
    // =====================================

    function loseLife(message) {

        if (lives <= 0) return;

        lives--;

        document.getElementById(
            "lives"
        ).textContent =
            lives;

        document.getElementById(
            "result"
        ).textContent =
            message;

        document.getElementById(
            "result"
        ).className =
            "wrong";

        saveGame();

        if (lives <= 0) {

            gameOver();

        }

    }


    // =====================================
    // GAME OVER
    // =====================================

    function gameOver() {

        clearInterval(timer);

        clearTimeout(questionDelay);

        disableButtons();

        document.getElementById(
            "result"
        ).textContent =
            "💀 GAME OVER!";

        document.getElementById(
            "result"
        ).className =
            "wrong";

        setTimeout(() => {

            alert(
                "💀 Game Over!\n\n" +
                "Skor akhir: " +
                score +
                "\n" +
                "Kamu mencapai Door " +
                doorNumber +
                "."
            );

            localStorage.removeItem(
                "100DoorsSave"
            );

            location.reload();

        }, 500);

    }


    // =====================================
    // DISABLE BUTTON
    // =====================================

    function disableButtons() {

        document
            .querySelectorAll(
                "#buttons button"
            )
            .forEach(button => {

                button.disabled = true;

                button.style.opacity =
                    "0.5";

            });

    }


    // =====================================
    // RESTART
    // =====================================

    function restartGame() {

        const confirmRestart =
            confirm(
                "⚠️ Yakin ingin restart?\n\n" +
                "Progress Door dan skor akan dihapus."
            );

        if (!confirmRestart) {

            return;

        }

        clearInterval(timer);

        clearTimeout(questionDelay);

        localStorage.removeItem(
            "100DoorsSave"
        );

        location.reload();

    }


    // =====================================
    // MULAI GAME
    // =====================================

    const hasSave =
        loadGame();

    if (hasSave) {

        setupCurrentDoor();

        startTimer();

    } else {

        doorNumber = 1;

        lives = 3;

        score = 0;

        time = 30;

        updateStats();

        setupDoor1();

        startTimer();

        saveGame();

    }
